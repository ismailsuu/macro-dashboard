<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ReEconomy - Makroekonomi Takip Paneli</title>

  <!-- Tarayıcı Sekmesi (Favicon) -->
  <link rel="icon" type="image/png" href="image.png">

  <!-- iOS Ana Ekran Uygulama Simgeleri -->
  <link rel="apple-touch-icon" href="image.png">
  <link rel="apple-touch-icon" sizes="180x180" href="image.png">

  <!-- Chrome / Android Web App Manifest & Tema Rengi -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sol Menü (Masaüstü) */
    #sidebar {
      width: 320px;
      min-width: 280px;
      background: var(--card);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }
    .brand-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      object-fit: contain;
    }
    .brand-title {
      font-size: 1.1rem;
      color: var(--accent);
      margin: 0;
      font-weight: 600;
    }

    #indicator-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .indicator-item {
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      font-size: 0.88rem;
      user-select: none;
    }
    .indicator-item:hover { background: #334155; }
    .indicator-item.active { background: var(--accent); color: #0f172a; font-weight: 600; }

    /* Ana Alan */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 24px;
      overflow-y: auto;
    }
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .select-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    select, .btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 9px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      outline: none;
    }
    .time-buttons {
      display: flex;
      gap: 6px;
      margin-left: auto;
    }
    .btn.active { background: var(--accent); color: #0f172a; font-weight: 600; }

    /* Gösterge Kartı ve Grafik */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .card h1 { font-size: 1.3rem; margin-bottom: 6px; }
    .card p { color: var(--subtext); font-size: 0.88rem; margin-bottom: 16px; line-height: 1.4; }
    .chart-box {
      position: relative;
      flex: 1;
      min-height: 380px;
      width: 100%;
    }
    #loading {
      color: var(--accent);
      font-size: 0.85rem;
      display: none;
      font-weight: 500;
    }

    /* Mobil Düzen */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
        overflow-y: auto;
      }
      #sidebar {
        width: 100%;
        min-width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding: 12px 16px;
      }
      .brand-header {
        margin-bottom: 10px;
      }
      #indicator-list {
        flex-direction: row;
        overflow-x: auto;
        white-space: nowrap;
        gap: 8px;
        padding-bottom: 4px;
        -webkit-overflow-scrolling: touch;
      }
      #indicator-list::-webkit-scrollbar {
        display: none;
      }
      .indicator-item {
        flex: 0 0 auto;
        background: #1e293b;
        border: 1px solid var(--border);
        padding: 8px 12px;
        font-size: 0.82rem;
      }
      #main {
        padding: 16px;
      }
      .controls {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      .select-wrapper {
        width: 100%;
      }
      .select-wrapper select {
        flex: 1;
      }
      .time-buttons {
        margin-left: 0;
        width: 100%;
      }
      .time-buttons .btn {
        flex: 1;
        text-align: center;
      }
      .card {
        padding: 16px;
      }
      .card h1 {
        font-size: 1.15rem;
      }
      .chart-box {
        min-height: 280px;
        height: 280px;
      }
    }
  </style>
</head>

      PRT: { interest_rate: [0.0, 0.0, 0.0, 2.0, 4.5, 3.4], mfg_pmi: [49.0, 46.0, 54.0, 48.0, 46.0, 48.0], services_pmi: [53.0, 42.0, 54.0, 52.0, 51.0, 53.0], biz_conf: [2.1, -10.2, 3.2, 1.5, 0.8, 1.8], consumer_conf: [-7.0, -25.0, -14.0, -32.0, -22.0, -16.0], retail_sales_mom: [0.2, -0.6, 0.7, -0.1, 0.2, 0.3], corp_tax: [21.0, 21.0, 21.0, 21.0, 21.0, 21.0], income_tax: [48.0, 48.0, 48.0, 48.0, 48.0, 48.0] },
      TUR: { interest_rate: [12.0, 17.0, 14.0, 9.0, 42.5, 50.0], mfg_pmi: [49.5, 50.8, 52.1, 48.1, 47.4, 44.3], services_pmi: [51.0, 45.0, 52.0, 49.0, 48.0, 48.5], biz_conf: [103.0, 96.0, 110.0, 101.0, 103.0, 102.2], consumer_conf: [59.0, 80.0, 69.0, 75.0, 77.0, 80.6], retail_sales_mom: [0.8, -1.5, 2.1, 0.4, 1.2, 0.8], corp_tax: [22.0, 22.0, 25.0, 23.0, 25.0, 25.0], income_tax: [40.0, 40.0, 40.0, 40.0, 40.0, 40.0] },
      GRC: { interest_rate: [0.0, 0.0, 0.0, 2.0, 4.5, 3.4], mfg_pmi: [53.9, 46.9, 59.0, 47.2, 51.8, 50.3], services_pmi: [54.0, 44.0, 55.0, 52.0, 52.0, 52.8], biz_conf: [105.0, 92.0, 110.0, 104.0, 107.0, 110.0], consumer_conf: [-40.0, -48.0, -42.0, -56.0, -50.0, -48.0], retail_sales_mom: [0.3, -0.9, 0.8, -0.3, 0.4, 0.4], corp_tax: [28.0, 24.0, 22.0, 22.0, 22.0, 22.0], income_tax: [44.0, 44.0, 44.0, 44.0, 44.0, 44.0] }
    };

    let selectedIndicator = indicators[0];
    let selectedCountry = "DEU";
    let selectedYears = 10;
    let chartInstance = null;

    const listEl = document.getElementById("indicator-list");
    indicators.forEach((ind, index) => {
      const item = document.createElement("div");
      item.className = `indicator-item ${index === 0 ? "active" : ""}`;
      item.innerText = `${ind.tr}`;
      item.title = `${ind.tr} (${ind.title})`;
      item.onclick = () => {
        document.querySelectorAll(".indicator-item").forEach(el => el.classList.remove("active"));
        item.classList.add("active");
        selectedIndicator = ind;
        fetchMacroData();
      };
      listEl.appendChild(item);
    });

    document.getElementById("country-select").addEventListener("change", (e) => {
      selectedCountry = e.target.value;
      fetchMacroData();
    });

    function setYears(years, event) {
      selectedYears = years;
      document.querySelectorAll(".time-buttons .btn").forEach(b => b.classList.remove("active"));
      if (event && event.target) {
        event.target.classList.add("active");
      }
      fetchMacroData();
    }

    async function fetchMacroData() {
      const loadingEl = document.getElementById("loading");
      loadingEl.style.display = "inline";

      document.getElementById("title").innerText = `${selectedIndicator.tr} (${selectedIndicator.title})`;
      document.getElementById("desc").innerText = selectedIndicator.desc;

      const currentYear = new Date().getFullYear();
      const startYear = currentYear - selectedYears;

      if (selectedIndicator.source === "api") {
        // Dünya Bankası API üzerinden dinamik veri çekimi
        const url = `https://api.worldbank.org/v2/country/${selectedCountry}/indicator/${selectedIndicator.id}?date=${startYear}:${currentYear}&format=json`;

        try {
          const res = await fetch(url);
          const data = await res.json();

          if (data && data[1]) {
            const cleanData = data[1]
              .filter(d => d.value !== null)
              .reverse();

            renderChart(cleanData.map(d => d.date), cleanData.map(d => Number(d.value.toFixed(2))));
          }
        } catch (err) {
          console.error("API Veri çekilemedi:", err);
        } finally {
          loadingEl.style.display = "none";
        }
      } else {
        // Yerel veri seti serileri (PMI, Faiz, Güven Endeksi, Vergiler)
        loadingEl.style.display = "none";
        const cData = localData[selectedCountry] && localData[selectedCountry][selectedIndicator.id];
        const allYears = ["2019", "2020", "2021", "2022", "2023", "2024"];

        if (cData) {
          let count = selectedYears === 3 ? 3 : (selectedYears === 5 ? 5 : 6);
          const labels = allYears.slice(-count);
          const values = cData.slice(-count);
          renderChart(labels, values);
        }
      }
    }

    function renderChart(labels, values) {
      const ctx = document.getElementById("chartCanvas").getContext("2d");
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: "line",
        data: {
          labels: labels,
          datasets: [{
            label: `${selectedIndicator.tr} (${selectedIndicator.unit})`,
            data: values,
            borderColor: "#38bdf8",
            backgroundColor: "rgba(56, 189, 248, 0.15)",
            borderWidth: 2,
            tension: 0.25,
            fill: true,
            pointRadius: 4,
            pointHoverRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { grid: { color: "#334155" }, ticks: { color: "#94a3b8" } },
            y: { grid: { color: "#334155" }, ticks: { color: "#94a3b8" } }
          },
          plugins: {
            legend: { labels: { color: "#f8fafc" } }
          }
        }
      });
    }

    fetchMacroData();
  </script>
</body>
</html>
