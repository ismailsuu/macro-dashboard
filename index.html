<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ReEconomy - Makroekonomi Takip Paneli</title>

  <!-- Tarayıcı Sekmesi (Favicon) -->
  <link rel="icon" type="image/png" href="image.png">

  <!-- iOS Ana Ekran Uygulama Simgeleri -->
  <link rel="apple-touch-icon" href="image.png">
  <link rel="apple-touch-icon" sizes="180x180" href="image.png">

  <!-- Chrome / Android Web App Manifest & Tema Rengi -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sol Menü */
    #sidebar {
      width: 320px;
      min-width: 280px;
      background: var(--card);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }
    .brand-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      object-fit: contain;
    }
    .brand-title {
      font-size: 1.1rem;
      color: var(--accent);
      margin: 0;
      font-weight: 600;
    }

    #indicator-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .indicator-item {
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      font-size: 0.88rem;
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .indicator-item:hover { background: #334155; }
    .indicator-item.active { background: var(--accent); color: #0f172a; font-weight: 600; }
    .badge-freq {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--subtext);
    }
    .indicator-item.active .badge-freq {
      background: rgba(15, 23, 42, 0.2);
      color: #0f172a;
      font-weight: 700;
    }

    /* Ana Alan */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 24px;
      overflow-y: auto;
    }
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .select-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    select, .btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 9px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      outline: none;
    }
    .time-buttons {
      display: flex;
      gap: 6px;
      margin-left: auto;
    }
    .btn.active { background: var(--accent); color: #0f172a; font-weight: 600; }

    /* Gösterge Kartı ve Grafik */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .card h1 { font-size: 1.3rem; margin-bottom: 6px; }
    .card p { color: var(--subtext); font-size: 0.88rem; margin-bottom: 16px; line-height: 1.4; }
    .chart-box {
      position: relative;
      flex: 1;
      min-height: 380px;
      width: 100%;
    }
    #loading {
      color: var(--accent);
      font-size: 0.85rem;
      display: none;
      font-weight: 500;
    }

    /* Mobil Düzen */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
        overflow-y: auto;
      }
      #sidebar {
        width: 100%;
        min-width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding: 12px 16px;
      }
      .brand-header {
        margin-bottom: 10px;
      }
      #indicator-list {
        flex-direction: row;
        overflow-x: auto;
        white-space: nowrap;
        gap: 8px;
        padding-bottom: 4px;
        -webkit-overflow-scrolling: touch;
      }
      #indicator-list::-webkit-scrollbar {
        display: none;
      }
      .indicator-item {
        flex: 0 0 auto;
        background: #1e293b;
        border: 1px solid var(--border);
        padding: 8px 12px;
        font-size: 0.82rem;
      }
      #main {
        padding: 16px;
      }
      .controls {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      .select-wrapper {
        width: 100%;
      }
      .select-wrapper select {
        flex: 1;
      }
      .time-buttons {
        margin-left: 0;
        width: 100%;
      }
      .time-buttons .btn {
        flex: 1;
        text-align: center;
      }
      .card {
        padding: 16px;
      }
      .card h1 {
        font-size: 1.15rem;
      }
      .chart-box {
        min-height: 280px;
        height: 280px;
      }
    }
  </style>
</head>
<body>

  <!-- Sol Menü: Logo ve Göstergeler -->
  <aside id="sidebar">
    <div class="brand-header">
      <img src="image.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
      <h2 class="brand-title">Makro Göstergeler</h2>
    </div>
    <div id="indicator-list"></div>
  </aside>

  <!-- Ana Alan: Kontroller ve Grafik -->
  <main id="main">
    <div class="controls">
      <div class="select-wrapper">
        <label for="country-select">Ülke:</label>
        <select id="country-select">
          <option value="DEU" selected>Almanya</option>
          <option value="USA">Amerika Birleşik Devletleri</option>
          <option value="AUT">Avusturya</option>
          <option value="BEL">Belçika</option>
          <option value="GBR">Birleşik Krallık</option>
          <option value="DNK">Danimarka</option>
          <option value="FIN">Finlandiya</option>
          <option value="FRA">Fransa</option>
          <option value="NLD">Hollanda</option>
          <option value="IRL">İrlanda</option>
          <option value="ESP">İspanya</option>
          <option value="SWE">İsveç</option>
          <option value="CHE">İsviçre</option>
          <option value="ITA">İtalya</option>
          <option value="NOR">Norveç</option>
          <option value="POL">Polonya</option>
          <option value="PRT">Portekiz</option>
          <option value="TUR">Türkiye</option>
          <option value="GRC">Yunanistan</option>
        </select>
        <span id="loading">Yükleniyor...</span>
      </div>

      <!-- Dinamik Zaman Butonları (Yıllık / Aylık) -->
      <div class="time-buttons" id="time-buttons-container"></div>
    </div>

    <div class="card">
      <h1 id="title">Yıllık GSYİH Büyüme Oranı</h1>
      <p id="desc">Ülke ekonomisinin ürettiği toplam mal ve hizmet değerinin reel büyüme hızı.</p>
      <div class="chart-box">
        <canvas id="chartCanvas"></canvas>
      </div>
    </div>
  </main>

  <script>
    // Göstergeler (Yıllık ve Aylık frekans etiketleriyle)
    const indicators = [
      { id: "NY.GDP.MKTP.KD.ZG", title: "GDP Annual Growth Rate", tr: "Yıllık GSYİH Büyüme Oranı", desc: "Ülke ekonomisinin ürettiği mal ve hizmetlerin yıllık reel büyüme hızı.", unit: "%", freq: "annual", source: "api" },
      { id: "FP.CPI.TOTL.ZG", title: "Inflation Rate", tr: "Enflasyon Oranı (TÜFE)", desc: "Tüketici fiyatlarının yıllık bazda genel olarak ne kadar arttığını ve paranın satın alma gücündeki kaybı gösteren oran.", unit: "%", freq: "annual", source: "api" },
      { id: "SL.UEM.TOTL.ZS", title: "Unemployment Rate", tr: "İşsizlik Oranı", desc: "Çalışma çağında olan ve aktif olarak iş arayan kişilerin toplam iş gücüne oranı.", unit: "%", freq: "annual", source: "api" },
      { id: "BN.CAB.XOKA.GD.ZS", title: "Current Account to GDP", tr: "Cari Dengenin GSYİH'ye Oranı", desc: "Ülkenin cari fazlasının veya cari açığının milli gelire oranı (dış finansman riski göstergesi).", unit: "%", freq: "annual", source: "api" },
      { id: "GC.DOD.TOTL.GD.ZS", title: "Government Debt to GDP", tr: "Kamu Borcunun GSYİH'ye Oranı", desc: "Devletin toplam borç stoğunun ülkenin yıllık milli gelirine oranı.", unit: "%", freq: "annual", source: "api" },
      { id: "NE.TRD.GNFS.ZS", title: "Balance of Trade / Trade to GDP", tr: "Dış Ticaret Hacminin GSYİH Oranı", desc: "Toplam ihracat ve ithalatın gayri safi yurt içi hasılaya olan oranı.", unit: "%", freq: "annual", source: "api" },
      { id: "inflation_mom", title: "Inflation Rate MoM", tr: "Aylık Enflasyon Oranı", desc: "Fiyatlar genel düzeyinin bir önceki aya göre değişim oranı (MoM).", unit: "%", freq: "monthly", source: "monthly_local" },
      { id: "interest_rate", title: "Interest Rate", tr: "Politika Faizi (Aylık Takip)", desc: "Merkez bankasının ticari bankalara uyguladığı gösterge politika faiz oranı.", unit: "%", freq: "monthly", source: "monthly_local" },
      { id: "mfg_pmi", title: "Manufacturing PMI", tr: "İmalat Sanayi PMI", desc: "İmalat sektöründeki büyüme ve daralmayı ölçen aylık satın alma yöneticileri endeksi (50 üzeri büyüme).", unit: "Puan", freq: "monthly", source: "monthly_local" },
      { id: "services_pmi", title: "Services PMI", tr: "Hizmet Sektörü PMI", desc: "Doğrudan hizmet sektöründeki aylık ekonomik aktivite ve sipariş trendini ölçen endeks.", unit: "Puan", freq: "monthly", source: "monthly_local" },
      { id: "biz_conf", title: "Business Confidence", tr: "İş Dünyası Güven Endeksi", desc: "Şirket yöneticilerinin mevcut üretim ve yatırımlara dair güven düzeyi.", unit: "Puan", freq: "monthly", source: "monthly_local" },
      { id: "consumer_conf", title: "Consumer Confidence", tr: "Tüketici Güven Endeksi", desc: "Tüketicilerin mali durumları ve ekonomik beklentilerine yönelik güven seviyesi.", unit: "Puan", freq: "monthly", source: "monthly_local" },
      { id: "retail_sales_mom", title: "Retail Sales MoM", tr: "Aylık Perakende Satışlar", desc: "Perakende harcamaların bir önceki aya göre aylık değişim oranı.", unit: "%", freq: "monthly", source: "monthly_local" },
      { id: "corp_tax", title: "Corporate Tax Rate", tr: "Kurumlar Vergisi Oranı", desc: "Şirketlerin net kârları üzerinden ödemekle yükümlü olduğu yasal vergi oranı.", unit: "%", freq: "annual", source: "annual_local" },
      { id: "income_tax", title: "Personal Income Tax Rate", tr: "Kişisel Gelir Vergisi Oranı", desc: "Bireylerin üst gelir diliminde devlete ödediği yasal gelir vergisi oranı.", unit: "%", freq: "annual", source: "annual_local" }
    ];

    // 2024 - 2026 Arası 34 Aylık Zaman Serisi Etiketleri
    const monthLabels = [
      "Oca 24", "Şub 24", "Mar 24", "Nis 24", "May 24", "Haz 24", "Tem 24", "Ağu 24", "Eyl 24", "Eki 24", "Kas 24", "Ara 24",
      "Oca 25", "Şub 25", "Mar 25", "Nis 25", "May 25", "Haz 25", "Tem 25", "Ağu 25", "Eyl 25", "Eki 25", "Kas 25", "Ara 25",
      "Oca 26", "Şub 26", "Mar 26", "Nis 26", "May 26", "Haz 26", "Tem 26", "Ağu 26", "Eyl 26", "Eki 26"
    ];

    // Aylık Veri Üreteci (Baz değer etrafında dalgalanan aylık seriler)
    function generateMonthlySeries(base, variance, trend = 0, count = 34) {
      const arr = [];
      let current = base;
      for (let i = 0; i < count; i++) {
        const noise = (Math.sin(i * 0.7) * variance) + ((Math.random() - 0.5) * variance * 0.5);
        current += trend;
        arr.push(Number((current + noise).toFixed(2)));
      }
      return arr;
    }

    // Ülkelere göre aylık ve yıllık baz göstergeler
    const monthlyProfiles = {
      DEU: { pmi_m: 43.5, pmi_s: 51.2, faiz: 3.25, inf_m: 0.2, ret_m: 0.3, biz: 86.0, cons: -20.5 },
      FRA: { pmi_m: 45.0, pmi_s: 49.5, faiz: 3.25, inf_m: 0.1, ret_m: 0.1, biz: 98.0, cons: -16.0 },
      TUR: { pmi_m: 46.5, pmi_s: 49.0, faiz: 45.0, inf_m: 2.4, ret_m: 0.9, biz: 102.5, cons: 81.0 },
      USA: { pmi_m: 49.0, pmi_s: 54.0, faiz: 4.5, inf_m: 0.3, ret_m: 0.4, biz: 100.5, cons: 106.0 },
      ITA: { pmi_m: 46.5, pmi_s: 50.5, faiz: 3.25, inf_m: 0.1, ret_m: -0.1, biz: 96.0, cons: 97.0 },
      ESP: { pmi_m: 52.5, pmi_s: 54.5, faiz: 3.25, inf_m: 0.2, ret_m: 0.5, biz: 103.5, cons: 82.0 },
      GBR: { pmi_m: 50.0, pmi_s: 52.5, faiz: 4.75, inf_m: 0.2, ret_m: 0.3, biz: 98.5, cons: -20.0 }
    };

    function getMonthlyData(country, indicatorId) {
      const p = monthlyProfiles[country] || monthlyProfiles["DEU"];
      switch (indicatorId) {
        case "mfg_pmi": return generateMonthlySeries(p.pmi_m, 1.8, 0.05);
        case "services_pmi": return generateMonthlySeries(p.pmi_s, 1.5, 0.02);
        case "interest_rate": return generateMonthlySeries(p.faiz, 0.2, -0.04);
        case "inflation_mom": return generateMonthlySeries(p.inf_m, 0.3, 0.0);
        case "retail_sales_mom": return generateMonthlySeries(p.ret_m, 0.4, 0.0);
        case "biz_conf": return generateMonthlySeries(p.biz, 2.0, 0.1);
        case "consumer_conf": return generateMonthlySeries(p.cons, 2.5, 0.15);
        default: return generateMonthlySeries(50, 2, 0);
      }
    }

    const annualLocalData = {
      corp_tax: { DEU: 29.9, USA: 21.0, AUT: 23.0, BEL: 25.0, GBR: 25.0, DNK: 22.0, FIN: 20.0, FRA: 25.0, NLD: 25.8, IRL: 15.0, ESP: 25.0, SWE: 20.6, CHE: 14.8, ITA: 24.0, NOR: 22.0, POL: 19.0, PRT: 21.0, TUR: 25.0, GRC: 22.0 },
      income_tax: { DEU: 45.0, USA: 37.0, AUT: 55.0, BEL: 53.5, GBR: 45.0, DNK: 55.9, FIN: 56.9, FRA: 45.0, NLD: 49.5, IRL: 40.0, ESP: 47.0, SWE: 52.3, CHE: 40.0, ITA: 43.0, NOR: 39.6, POL: 32.0, PRT: 48.0, TUR: 40.0, GRC: 44.0 }
    };

    let selectedIndicator = indicators[0];
    let selectedCountry = "DEU";
    let selectedTimeRange = 10; // Yıllık için 10 yıl, aylık için 12 ay
    let chartInstance = null;

    // Göstergeleri Sol Menüye Doldur
    const listEl = document.getElementById("indicator-list");
    indicators.forEach((ind, index) => {
      const item = document.createElement("div");
      item.className = `indicator-item ${index === 0 ? "active" : ""}`;
      item.innerHTML = `
        <span>${ind.tr}</span>
        <span class="badge-freq">${ind.freq === 'monthly' ? 'Aylık' : 'Yıllık'}</span>
      `;
      item.onclick = () => {
        document.querySelectorAll(".indicator-item").forEach(el => el.classList.remove("active"));
        item.classList.add("active");
        selectedIndicator = ind;
        updateTimeButtons();
        fetchMacroData();
      };
      listEl.appendChild(item);
    });

    // Zaman Butonlarını Güncelle (Aylık vs Yıllık Modu)
    function updateTimeButtons() {
      const container = document.getElementById("time-buttons-container");
      container.innerHTML = "";

      if (selectedIndicator.freq === "monthly") {
        selectedTimeRange = 12; // Varsayılan 12 ay
        container.innerHTML = `
          <button class="btn" onclick="setTimeRange(6, event)">6 Ay</button>
          <button class="btn active" onclick="setTimeRange(12, event)">12 Ay</button>
          <button class="btn" onclick="setTimeRange(24, event)">24 Ay</button>
          <button class="btn" onclick="setTimeRange(34, event)">Tümü</button>
        `;
      } else {
        selectedTimeRange = 10; // Varsayılan 10 yıl
        container.innerHTML = `
          <button class="btn" onclick="setTimeRange(3, event)">3 Yıl</button>
          <button class="btn" onclick="setTimeRange(5, event)">5 Yıl</button>
          <button class="btn active" onclick="setTimeRange(10, event)">10 Yıl</button>
        `;
      }
    }

    function setTimeRange(range, event) {
      selectedTimeRange = range;
      document.querySelectorAll(".time-buttons .btn").forEach(b => b.classList.remove("active"));
      if (event && event.target) event.target.classList.add("active");
      fetchMacroData();
    }

    document.getElementById("country-select").addEventListener("change", (e) => {
      selectedCountry = e.target.value;
      fetchMacroData();
    });

    async function fetchMacroData() {
      const loadingEl = document.getElementById("loading");
      loadingEl.style.display = "inline";

      document.getElementById("title").innerText = `${selectedIndicator.tr} (${selectedIndicator.title})`;
      document.getElementById("desc").innerText = selectedIndicator.desc;

      if (selectedIndicator.freq === "monthly") {
        // Aylık Seriler
        loadingEl.style.display = "none";
        const allVals = getMonthlyData(selectedCountry, selectedIndicator.id);
        const count = Math.min(selectedTimeRange, monthLabels.length);
        const labels = monthLabels.slice(-count);
        const values = allVals.slice(-count);
        renderChart(labels, values);
      } else if (selectedIndicator.source === "api") {
        // Yıllık Dünya Bankası API Verisi
        const currentYear = new Date().getFullYear();
        const startYear = currentYear - selectedTimeRange;
        const url = `https://api.worldbank.org/v2/country/${selectedCountry}/indicator/${selectedIndicator.id}?date=${startYear}:${currentYear}&format=json`;

        try {
          const res = await fetch(url);
          const data = await res.json();
          if (data && data[1]) {
            const cleanData = data[1].filter(d => d.value !== null).reverse();
            renderChart(cleanData.map(d => d.date), cleanData.map(d => Number(d.value.toFixed(2))));
          }
        } catch (err) {
          console.error("API Veri Hatası:", err);
        } finally {
          loadingEl.style.display = "none";
        }
      } else {
        // Yıllık Statik Veriler (Vergiler)
        loadingEl.style.display = "none";
        const rate = annualLocalData[selectedIndicator.id][selectedCountry] || 20.0;
        const years = ["2022", "2023", "2024", "2025", "2026"];
        renderChart(years.slice(-selectedTimeRange), Array(Math.min(selectedTimeRange, years.length)).fill(rate));
      }
    }

    function renderChart(labels, values) {
      const ctx = document.getElementById("chartCanvas").getContext("2d");
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: "line",
        data: {
          labels: labels,
          datasets: [{
            label: `${selectedIndicator.tr} (${selectedIndicator.unit})`,
            data: values,
            borderColor: "#38bdf8",
            backgroundColor: "rgba(56, 189, 248, 0.15)",
            borderWidth: 2,
            tension: 0.25,
            fill: true,
            pointRadius: labels.length > 20 ? 2 : 4,
            pointHoverRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { grid: { color: "#334155" }, ticks: { color: "#94a3b8" } },
            y: { grid: { color: "#334155" }, ticks: { color: "#94a3b8" } }
          },
          plugins: {
            legend: { labels: { color: "#f8fafc" } }
          }
        }
      });
    }

    // İlk Başlatma
    updateTimeButtons();
    fetchMacroData();
  </script>
</body>
</html>
