<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Küresel Makroekonomi Takip Paneli</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

    /* Sol Menü - Excel'deki Göstergeler */
    #sidebar { width: 320px; background: var(--card); border-right: 1px solid var(--border); overflow-y: auto; padding: 16px; }
    #sidebar h2 { font-size: 1.1rem; margin-bottom: 12px; color: var(--accent); }
    .indicator-item { padding: 10px 12px; margin-bottom: 6px; border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
    .indicator-item:hover { background: #334155; }
    .indicator-item.active { background: var(--accent); color: #0f172a; font-weight: 600; }

    /* Ana Alan */
    #main { flex: 1; display: flex; flex-direction: column; padding: 24px; overflow-y: auto; }
    .controls { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
    select, .btn { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
    .btn.active { background: var(--accent); color: #0f172a; font-weight: 600; }

    /* Gösterge Kartı ve Grafik */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
    .card h1 { font-size: 1.4rem; margin-bottom: 6px; }
    .card p { color: var(--subtext); font-size: 0.9rem; margin-bottom: 16px; line-height: 1.4; }
    .chart-box { position: relative; height: 420px; width: 100%; }
    #loading { display: none; color: var(--accent); font-size: 0.85rem; }
  </style>
</head>
<body>

  <!-- Sol Menü: Excel'deki Tanımlar -->
  <aside id="sidebar">
    <h2>Makro Göstergeler</h2>
    <div id="indicator-list"></div>
  </aside>

  <!-- Sağ Panel: Kontroller ve Grafik -->
  <main id="main">
    <div class="controls">
      <label for="country-select">Ülke:</label>
      <select id="country-select">
        <option value="TUR">Türkiye</option>
        <option value="USA">Amerika Birleşik Devletleri</option>
        <option value="DEU">Almanya</option>
        <option value="GBR">Birleşik Krallık</option>
        <option value="JPN">Japonya</option>
        <option value="CHN">Çin</option>
      </select>

      <div style="margin-left: auto; display: flex; gap: 6px;">
        <button class="btn" onclick="setYears(3)">3 Yıl</button>
        <button class="btn" onclick="setYears(5)">5 Yıl</button>
        <button class="btn active" onclick="setYears(10)">10 Yıl</button>
      </div>
      <span id="loading">Veri çekiliyor...</span>
    </div>

    <div class="card">
      <h1 id="title">Yıllık GSYİH Büyüme Oranı</h1>
      <p id="desc">Ülke ekonomisinin ürettiği toplam mal ve hizmet değerinin reel büyüme hızı.</p>
      <div class="chart-box">
        <canvas id="chartCanvas"></canvas>
      </div>
    </div>
  </main>

  <script>
    // Excel dosyasındaki O.view sayfasından alınan eşleşmeler ve Dünya Bankası API kodları
    const indicators = [
      { id: "NY.GDP.MKTP.KD.ZG", title: "GDP Annual Growth Rate", tr: "Yıllık GSYİH Büyüme Oranı", desc: "Ülke ekonomisinin ürettiği mal ve hizmetlerin yıllık reel büyüme hızı.", unit: "%" },
      { id: "FP.CPI.TOTL.ZG", title: "Inflation Rate", tr: "Enflasyon Oranı (TÜFE)", desc: "Tüketici fiyatlarının yıllık bazda genel olarak ne kadar arttığını gösteren oran.", unit: "%" },
      { id: "SL.UEM.TOTL.ZS", title: "Unemployment Rate", tr: "İşsizlik Oranı", desc: "Çalışma çağında olan ve aktif iş arayanların toplam iş gücüne oranı.", unit: "%" },
      { id: "BN.CAB.XOKA.GD.ZS", title: "Current Account to GDP", tr: "Cari Dengenin GSYİH'ye Oranı", desc: "Ülkenin cari dengesinin milli gelire oranı (dış risk göstergesi).", unit: "%" },
      { id: "GC.DOD.TOTL.GD.ZS", title: "Government Debt to GDP", tr: "Kamu Borcunun GSYİH'ye Oranı", desc: "Devlet toplam borç stoğunun yıllık milli gelire oranı.", unit: "%" },
      { id: "NE.TRD.GNFS.ZS", title: "Balance of Trade / Trade to GDP", tr: "Dış Ticaret Hacminin GSYİH Oranı", desc: "Toplam ihracat ve ithalatın gayri safi yurtiçi hasılaya olan oranı.", unit: "%" }
    ];

    let selectedIndicator = indicators[0];
    let selectedCountry = "TUR";
    let selectedYears = 10;
    let chartInstance = null;

    // Menüyü oluştur
    const listEl = document.getElementById("indicator-list");
    indicators.forEach((ind, index) => {
      const item = document.createElement("div");
      item.className = `indicator-item ${index === 0 ? "active" : ""}`;
      item.innerText = `${ind.tr} (${ind.title})`;
      item.onclick = () => {
        document.querySelectorAll(".indicator-item").forEach(el => el.classList.remove("active"));
        item.classList.add("active");
        selectedIndicator = ind;
        fetchMacroData();
      };
      listEl.appendChild(item);
    });

    // Ülke seçimi
    document.getElementById("country-select").addEventListener("change", (e) => {
      selectedCountry = e.target.value;
      fetchMacroData();
    });

    function setYears(years) {
      selectedYears = years;
      document.querySelectorAll(".btn").forEach(b => b.classList.remove("active"));
      event.target.classList.add("active");
      fetchMacroData();
    }

    // Dünya Bankası API'sinden anlık veri çekme
    async function fetchMacroData() {
      const loadingEl = document.getElementById("loading");
      loadingEl.style.display = "inline";

      document.getElementById("title").innerText = `${selectedIndicator.tr} (${selectedIndicator.title})`;
      document.getElementById("desc").innerText = selectedIndicator.desc;

      const currentYear = new Date().getFullYear();
      const startYear = currentYear - selectedYears;
      const url = `https://api.worldbank.org/v2/country/${selectedCountry}/indicator/${selectedIndicator.id}?date=${startYear}:${currentYear}&format=json`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        
        if (data && data[1]) {
          // Gelen veriyi kronolojik sıraya çevir
          const cleanData = data[1]
            .filter(d => d.value !== null)
            .reverse();

          renderChart(cleanData.map(d => d.date), cleanData.map(d => d.value));
        }
      } catch (err) {
        console.error("Veri çekilemedi:", err);
      } finally {
        loadingEl.style.display = "none";
      }
    }

    function renderChart(labels, values) {
      const ctx = document.getElementById("chartCanvas").getContext("2d");
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: "line",
        data: {
          labels: labels,
          datasets: [{
            label: `${selectedIndicator.tr} (${selectedIndicator.unit})`,
            data: values,
            borderColor: "#38bdf8",
            backgroundColor: "rgba(56, 189, 248, 0.15)",
            borderWidth: 2,
            tension: 0.25,
            fill: true,
            pointRadius: 4,
            pointHoverRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { grid: { color: "#334155" }, ticks: { color: "#94a3b8" } },
            y: { grid: { color: "#334155" }, ticks: { color: "#94a3b8" } }
          },
          plugins: {
            legend: { labels: { color: "#f8fafc" } }
          }
        }
      });
    }

    // İlk yükleme
    fetchMacroData();
  </script>
</body>
</html>
